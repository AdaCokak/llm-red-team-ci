name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -e '.[dev,infra]'
          npm ci
      - name: Run free unit and infrastructure tests
        run: pytest -m 'not bedrock' -q
      - name: Synthesize CloudFormation
        run: npm run cdk -- synth --quiet
